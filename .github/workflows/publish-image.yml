name: Publish report image
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/report
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test and build
        run: |
          python3 -m unittest discover -s tests
          docker build -f containers/report.Dockerfile \
            --build-arg MAVEN_IMAGE=maven:3.9-eclipse-temurin-25 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "$IMAGE:$GITHUB_SHA" .
          docker run --rm "$IMAGE:$GITHUB_SHA" python3 /opt/fletcher/fletcher.py --help
          docker run --rm "$IMAGE:$GITHUB_SHA" osv-scanner --version
      - name: Publish to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")
          printf 'GitLab `FLETCHER_REPORT_IMAGE`: `%s`\n' "$ref" >> "$GITHUB_STEP_SUMMARY"
