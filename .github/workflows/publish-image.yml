name: Publish report image
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-report-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}/report
    steps:
      - name: Check published architectures
        id: image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker buildx imagetools inspect --raw "$IMAGE:$GITHUB_SHA" > "$RUNNER_TEMP/report-index.json" &&
             jq -e 'any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "amd64") and any(.manifests[]?; .platform.os == "linux" and .platform.architecture == "arm64")' "$RUNNER_TEMP/report-index.json" >/dev/null; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'Both architectures are already published for this commit.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.image.outputs.build == 'true'
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        if: steps.image.outputs.build == 'true'
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
        if: steps.image.outputs.build == 'true'
      - name: Test and build
        if: steps.image.outputs.build == 'true'
        run: |
          python3 -m unittest discover -s tests
          for arch in amd64 arm64; do
            docker buildx build --load --platform "linux/$arch" \
              -f containers/report.Dockerfile \
              --build-arg MAVEN_IMAGE=maven:3.9-eclipse-temurin-25 \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -t "$IMAGE:$GITHUB_SHA-$arch" .
            docker run --rm --platform "linux/$arch" "$IMAGE:$GITHUB_SHA-$arch" python3 /opt/fletcher/fletcher.py --help
            docker run --rm --platform "linux/$arch" "$IMAGE:$GITHUB_SHA-$arch" osv-scanner --version
          done
      - name: Publish to GHCR
        if: steps.image.outputs.build == 'true'
        run: |
          for arch in amd64 arm64; do
            docker push "$IMAGE:$GITHUB_SHA-$arch"
          done
          docker buildx imagetools create -t "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
          digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE:$GITHUB_SHA")
          printf 'Multi-arch report image: `%s@%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
