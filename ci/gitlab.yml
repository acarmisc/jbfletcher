fletcher-report:
  image: $FLETCHER_REPORT_IMAGE
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")'
  script:
    - mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom
    - python3 /opt/fletcher/fletcher.py --output fletcher-scan.json scan target/bom.json --summary fletcher-summary.md
    - python3 /opt/fletcher/fletcher.py --output fletcher-digest.json digest
  artifacts:
    when: always
    access: developer
    expire_in: 14 days
    paths:
      - fletcher-scan.json
      - fletcher-digest.json
      - fletcher-summary.md

fletcher-renovate:
  image:
    name: $FLETCHER_RENOVATE_IMAGE
    entrypoint: ['']
  resource_group: fletcher-renovate
  needs:
    - job: fletcher-report
      artifacts: false
  environment: fletcher-publisher
  variables:
    GIT_STRATEGY: none
    RENOVATE_PLATFORM: gitlab
    RENOVATE_ONBOARDING: 'false'
    RENOVATE_REQUIRE_CONFIG: required
  rules:
    - if: '$FLETCHER_PROPOSE == "true" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "schedule"'
  script:
    - RENOVATE_ENDPOINT="$CI_API_V4_URL/" renovate "$CI_PROJECT_PATH"
